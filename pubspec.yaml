name: ankoris
description: "Ankoris - Bilimsel Hafıza Teknikleri ve Mnevo AI Destekli Kelime Öğrenme Platformu"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Durum Yönetimi & Reaktif Mimari
  flutter_riverpod: ^2.5.1

  # Çevrimdışı Veritabanı & Yerel Depolama (Offline-First)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3 # Masaüstü / Test desteği
  path: ^1.9.0
  path_provider: ^2.1.3

  # Bulut Veritabanı & Kimlik Doğrulama
  supabase_flutter: ^2.5.6

  # Ağ Bağlantı Kontrolü & HTTP
  connectivity_plus: ^6.0.3
  http: ^1.2.1

  # Ses & Telaffuz (TTS)
  flutter_tts: ^4.0.2

  # Yardımcı Araçlar
  uuid: ^4.4.0
  intl: ^0.19.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
